<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07182f">
  <title>Page not found</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      color: #f8fafc;
      background: radial-gradient(ellipse at 50% 0%, #174779 0%, transparent 55%), linear-gradient(160deg, #06162f, #0b3674);
      font: 16px/1.5 system-ui, sans-serif;
    }
    body:not(.is-challenge) {
      display: block;
      min-height: 0;
      max-width: 38rem;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: #e8edf5;
      background: #182331;
      font: 1.1rem/1.5 system-ui, sans-serif;
    }
    body:not(.is-challenge) .card {
      width: auto;
      padding: 0;
      text-align: left;
      border: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
    }
    body:not(.is-challenge) .primary {
      display: inline-block;
      padding: .75rem 1rem;
      border: 0;
      border-radius: .5rem;
      color: #182331;
      background: #b4e2c6;
      box-shadow: none;
      font-weight: 400;
    }
    .card {
      width: min(100%, 540px);
      padding: clamp(26px, 6vw, 48px);
      text-align: center;
      border: 1px solid #3a79b9;
      border-radius: 28px;
      background: linear-gradient(160deg, rgba(29, 57, 93, .97), rgba(7, 24, 47, .98));
      box-shadow: 0 24px 70px #020b1c99, inset 0 1px 0 #ffffff29;
    }
    .logo { display: block; width: min(190px, 48%); height: auto; margin: -8px auto 4px; }
    .brand { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: .02em; }
    .eyebrow { margin: 0 0 26px; color: #38bdf8; font-size: .7rem; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 6vw, 2.35rem); line-height: 1.15; letter-spacing: -.035em; }
    .description { max-width: 390px; margin: 0 auto 26px; color: #cbd5e1; }
    a, button { font: inherit; cursor: pointer; }
    .primary {
      display: block;
      padding: 14px 20px;
      border: 1px solid #58c8ff;
      border-radius: 14px;
      color: white;
      background: linear-gradient(#168fff, #0754dc);
      box-shadow: inset 0 1px 4px #a6e7ff99, 0 5px 18px #087cf466;
      font-weight: 750;
      text-decoration: none;
    }
    .primary:hover { background: linear-gradient(#35a6ff, #0865ed); }
    .link-area { margin-top: 28px; text-align: left; }
    label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: .85rem; font-weight: 700; }
    .copy-row { display: flex; gap: 8px; }
    input {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #3a6796;
      border-radius: 10px;
      color: #f8fafc;
      background: #07182f;
      font: inherit;
      font-size: .85rem;
    }
    button {
      padding: 10px 16px;
      border: 1px solid #4e81b2;
      border-radius: 10px;
      color: #f8fafc;
      background: #1d395d;
      font-weight: 700;
    }
    button:hover { background: #294c75; }
    :focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
    #status { min-height: 1.5em; margin: 8px 0 0; color: #b9e7ff; font-size: .85rem; }
    @media (max-width: 380px) { .copy-row { flex-direction: column; } }
  </style>
</head>
<body>
  <main class="card">
    <section id="challenge" hidden>
      <img class="logo" src="/assets/twenty48-logo.png" alt="">
      <p class="brand">Twenty48</p>
      <p class="eyebrow">Gravity Drop</p>
      <h1>You’ve been challenged!</h1>
      <p class="description">Install Twenty48 to play, then reopen this link or paste it into the app.</p>
      <a class="primary" href="https://play.google.com/store/apps/details?id=com.caveybytes.twenty48">Get it on Google Play</a>
      <div class="link-area">
        <label for="link">Challenge link</label>
        <div class="copy-row">
          <input id="link" type="text" readonly>
          <button id="copy" type="button">Copy link</button>
        </div>
        <p id="status" role="status"></p>
      </div>
    </section>

    <section id="not-found">
      <h1>Page not found</h1>
      <p class="description">Sorry, we couldn’t find that page.</p>
      <a class="primary" href="/">Go to the home page</a>
    </section>
  </main>

  <script>
    const prefix = "/twenty48/challenge/";
    if (window.location.pathname.startsWith(prefix)) {
      document.title = "Twenty48 challenge";
      document.body.classList.add("is-challenge");
      document.getElementById("not-found").hidden = true;
      document.getElementById("challenge").hidden = false;

      const link = document.getElementById("link");
      const status = document.getElementById("status");
      link.value = window.location.href;

      document.getElementById("copy").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(link.value);
          status.textContent = "Link copied.";
        } catch {
          link.select();
          status.textContent = "Select and copy the link above.";
        }
      });
    }
  </script>
</body>
</html>
